name: Deploy Stellara to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REMOTE_DIR: /srv/saas/stellara

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add SSH key to agent
        uses: webfactory/ssh-agent@v0.6.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -euo pipefail
          cd "${{ env.REMOTE_DIR }}" || exit 1

          echo "[deploy] branch: $(git rev-parse --abbrev-ref HEAD)"
          git fetch --all --prune
          git reset --hard origin/main
          # Keep env/config files but remove stale tracked and untracked artifacts.
          git clean -fd -e .env -e .env.local -e ecosystem.config.cjs

          echo "[deploy] commit: $(git rev-parse --short HEAD)"
          npm ci
          rm -rf .nuxt .output
          npm run build

          # Extra safety: ensure no stale process keeps old chunks in memory.
          if pm2 describe stellara > /dev/null 2>&1; then
            pm2 restart stellara --update-env
          else
            pm2 start ecosystem.config.cjs
          fi
          pm2 save
          EOF
